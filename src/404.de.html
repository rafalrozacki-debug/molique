<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seite nicht gefunden (404) - molique</title>

    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0284C7" />

    <!-- Favicons (diese Seite nutzt nicht das head.html-Partial) -->
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />

    <link
      rel="preload"
      href="fonts/inter-v20-latin_latin-ext-regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="fonts/poppins-v24-latin_latin-ext-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <link rel="stylesheet" href="css/molique-style.css" />
  </head>
  <body class="bg-body">
    <!--
      404-SEITE — ZUM KOPIEREN IN IHR EIGENES PROJEKT

      Ausschließlich mit molique-Klassen aufgebaut, ohne eine einzige
      Zeile eigenes CSS. Für die Verwendung in Ihrem eigenen Projekt
      tauschen Sie drei Dinge aus:

        1. <title> und Überschriftentext gegen Ihre eigenen,
        2. die beiden Links unten (Startseite + einen zweiten
           sinnvollen Ort, z. B. /kontakt statt der Dokumentation),
        3. die Favicons im <head> gegen Ihre eigenen.

      Wo die Datei hochladen: Auf GitHub Pages und Netlify genügt eine
      404.html im Root-Verzeichnis — der Server nutzt sie automatisch.
      Bei Apache fügen Sie "ErrorDocument 404 /404.html" zur .htaccess
      hinzu, bei nginx "error_page 404 /404.html;".
    -->
    <main
      class="min-vh-100 d-flex flex-column justify-content-center align-items-center text-center p-4"
    >
      <div class="container">
        <div class="grid-cols-1 grid-md-cols-12">
          <div class="col-md-span-8 col-md-start-3">
            <p class="text-12 fw-black text-primary m-0">404</p>

            <h1 class="text-8 fw-bold mt-3 mb-3">Diese Seite gibt es nicht</h1>

            <p class="text-5 text-muted mb-5">
              Die Adresse ist falsch, oder die Seite wurde verschoben.
              Hier sind zwei Orte, von denen aus Sie leicht zurück auf
              den richtigen Weg finden.
            </p>

            <div class="d-flex flex-wrap justify-content-center gap-3">
              <a href="index.de" class="btn btn-primary btn-lg fw-bold">
                Startseite
              </a>
              <a href="docs.de" class="btn btn-outline-dark btn-lg fw-bold">
                Dokumentation
              </a>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="js/molique-script.js"></script>
  </body>
</html>
