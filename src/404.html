<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Strona nie znaleziona (404) - molique</title>

    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#5145E5" />

    <!-- Favicony (ta strona nie używa partiala head.html) -->
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />

    <link
      rel="preload"
      href="fonts/poppins-v24-latin-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="fonts/poppins-v24-latin-ext-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="fonts/poppins-v24-latin-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="fonts/poppins-v24-latin-ext-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <link rel="stylesheet" href="css/molique-style.css?v={{ __version }}" />
  </head>
  <body class="bg-body">
    <!--
      STRONA 404 - DO SKOPIOWANIA DO WŁASNEGO PROJEKTU

      Zbudowana wyłącznie z klas molique, bez ani jednej linijki własnego CSS.
      Żeby użyć jej u siebie, podmień trzy rzeczy:

        1. <title> i treść nagłówka na swoje,
        2. dwa linki na dole (strona główna + drugie sensowne miejsce,
           np. /kontakt zamiast dokumentacji),
        3. favicony w <head> na własne.

      Gdzie wgrać plik: na GitHub Pages i Netlify wystarczy 404.html w korzeniu
      - serwer użyje go automatycznie. Na Apache dopisz do .htaccess
      "ErrorDocument 404 /404.html", a na nginx "error_page 404 /404.html;".
    -->
    <main
      class="min-vh-100 d-flex flex-column justify-content-center align-items-center text-center p-4"
    >
      <div class="container">
        <div class="grid-cols-1 grid-md-cols-12">
          <div class="col-md-span-8 col-md-start-3">
            <p class="text-12 fw-black text-primary m-0">404</p>

            <h1 class="text-8 fw-bold mt-3 mb-3">Tej strony tu nie ma</h1>

            <p class="text-5 text-muted mb-5">
              Adres jest błędny albo strona została przeniesiona. Poniżej dwa
              miejsca, z których łatwo wrócić na właściwy tor.
            </p>

            <div class="d-flex flex-wrap justify-content-center gap-3">
              <a href="./" class="btn btn-primary btn-lg fw-bold">
                Strona główna
              </a>
              <a href="docs" class="btn btn-outline-dark btn-lg fw-bold">
                Dokumentacja
              </a>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="js/molique-script.js?v={{ __version }}"></script>
  </body>
</html>
