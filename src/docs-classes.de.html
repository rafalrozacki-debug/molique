<!doctype html>
<html lang="de" data-theme="light">
  <head>
    <include
      src="partials/head.html"
      locals='{"title":"Klassenübersicht (Cheat Sheet) - molique Docs"}'
    ></include>
    <link rel="stylesheet" href="css/molique-style-admin.css?v={{ __version }}" />
    <link rel="stylesheet" href="css/molique-style-docs.css?v={{ __version }}" />
  </head>
  <body>
    <include src="partials/navbar.de.html"></include>
    <div class="admin-layout admin-layout-floating">
      <!-- SEITENLEISTE -->
      <include src="partials/docs-sidebar.de.html"></include>

      <!-- HAUPTINHALT -->
      <main class="admin-main">
        <div class="docs-content-wrapper" style="max-width: 1200px">
          <div class="mb-5 pb-4 border-bottom">
            <h1 class="fw-black mb-3">Klassenübersicht (Master Cheat Sheet)</h1>
            <p class="text-5 text-muted">
              Eine vollständige, interaktive Liste aller im molique-Framework
              verfügbaren Utility-Klassen und Komponenten.
            </p>
          </div>

          <!-- SUCHE -->
          <div class="input-group shadow-sm mb-4" style="max-width: 400px">
            <span class="input-group-text bg-surface">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="18"
                height="18"
                fill="currentColor"
                viewBox="0 0 256 256"
              >
                <path
                  d="M229.66,218.34l-50.07-50.06a88.11,88.11,0,1,0-11.31,11.31l50.06,50.07a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Z"
                ></path>
              </svg>
            </span>
            <input
              type="text"
              class="input"
              id="classSearch"
              placeholder="Klasse oder Problem suchen (z. B. zentrieren)..."
              data-search-target="#cheatSheetBody"
              data-search-status="#classSearchCount"
              data-search-hotkey="/"
            />
          </div>

          <p class="text-2 text-muted mb-4">
            Suche nach Klassenname oder Problem - <kbd>/</kbd> fokussiert das Feld, <kbd>Esc</kbd> leert es.
            <span id="classSearchCount" class="fw-semibold" role="status" aria-live="polite"></span>
          </p>

          <!-- HAUPTTABELLE -->
          <include src="partials/cheatsheet.de.html"></include>
        </div>
      </main>
    </div>

    <script src="js/molique-script.js?v={{ __version }}" defer></script>
  </body>
</html>
