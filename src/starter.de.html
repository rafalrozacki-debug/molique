<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>molique - Starter</title>

    <!--
      FAVICONS: absichtlich leer. Diese Datei kopieren Sie in Ihr
      eigenes Projekt, daher würde das Einfügen der molique-Icons hier
      Ihrer Seite ein FREMDES Logo im Browser-Tab geben. Erzeugen Sie
      ein eigenes Set und kommentieren Sie Folgendes ein:
    -->
    <!--
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    -->

    <!--
      OPTIONAL: Preload der wichtigsten Poppins-Schriftschnitte -
      verkürzt das erste Rendering. Die @font-face-Regeln selbst sind
      bereits in molique-style.css eingebaut; benötigt wird nur der
      Ordner fonts/ neben css/.
    -->
    <link rel="preload" href="fonts/poppins-v24-latin-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/poppins-v24-latin-ext-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/poppins-v24-latin-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/poppins-v24-latin-ext-600.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Framework-Kern (erforderlich) -->
    <link rel="stylesheet" href="css/molique-style.css?v={{ __version }}" />

    <!--
      OPTIONALE Module - binden Sie nur die ein, die Sie nutzen:
      <link rel="stylesheet" href="css/molique-style-admin.css?v={{ __version }}" />
      <link rel="stylesheet" href="css/molique-style-shop.css?v={{ __version }}" />
      <link rel="stylesheet" href="css/molique-style-blog.css?v={{ __version }}" />
    -->
  </head>
  <body>
    <main class="container py-5">
      <span class="badge badge-primary mb-3">molique</span>
      <h1 class="text-8 fw-black mb-3">Willkommen bei molique!</h1>
      <p class="text-4 text-muted mb-4">
        Ein ultraleichtes B2B-CSS-Framework auf Basis nativer
        Kaskadenschichten. Dies ist eine Starter-Vorlage - entfernen Sie
        den Inhalt und beginnen Sie mit dem Aufbau.
      </p>

      <div class="d-flex flex-wrap gap-2 mb-5">
        <button class="btn btn-primary">Primärer Button</button>
        <button class="btn btn-outline-primary">Sekundär</button>
      </div>

      <div class="grid-cols-1 grid-md-cols-3 gap-3">
        <div class="card">
          <div class="card-header fw-bold">Karte</div>
          <div class="card-body">
            <p class="m-0 text-muted">
              molique-Komponenten funktionieren sofort, ohne Konfiguration.
            </p>
          </div>
        </div>
        <div class="card">
          <div class="card-body">
            <div class="form-floating">
              <input type="text" class="input" id="starterInput" placeholder=" " />
              <label for="starterInput">Textfeld</label>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="card-body d-flex flex-column gap-2">
            <div class="alert alert-success m-0">Einsatzbereit.</div>
            <label class="form-switch">
              <input type="checkbox" class="form-switch-input" checked />
              <span class="form-switch-label">Schalter</span>
            </label>
          </div>
        </div>
      </div>
    </main>

    <!--
      JS-Kern + Modul-Autoloader. MUSS das defer-Attribut haben.
      Der Autoloader lädt Module aus js/modules/ nur nach, wenn die
      jeweilige Komponente auf der Seite vorhanden ist - lassen Sie
      den Ordner js/ vollständig bestehen.
    -->
    <script defer src="js/molique-script.js"></script>
  </body>
</html>
