<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found (404) - molique</title>

    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#5145E5" />

    <!-- Favicons (this page doesn't use the head.html partial) -->
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />

    <link
      rel="preload"
      href="fonts/poppins-v24-latin-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="fonts/poppins-v24-latin-ext-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="fonts/poppins-v24-latin-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="fonts/poppins-v24-latin-ext-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <link rel="stylesheet" href="css/molique-style.css?v={{ __version }}" />
  </head>
  <body class="bg-body">
    <!--
      404 PAGE — COPY THIS INTO YOUR OWN PROJECT

      Built entirely with molique classes, without a single line of
      custom CSS. To use it in your own project, swap three things:

        1. the <title> and heading content for your own,
        2. the two links at the bottom (home page + a second sensible
           destination, e.g. /contact instead of the documentation),
        3. the favicons in <head> for your own.

      Where to deploy the file: on GitHub Pages and Netlify, a 404.html
      in the root is enough — the server uses it automatically. On
      Apache, add "ErrorDocument 404 /404.html" to .htaccess, and on
      nginx "error_page 404 /404.html;".
    -->
    <main
      class="min-vh-100 d-flex flex-column justify-content-center align-items-center text-center p-4"
    >
      <div class="container">
        <div class="grid-cols-1 grid-md-cols-12">
          <div class="col-md-span-8 col-md-start-3">
            <p class="text-12 fw-black text-primary m-0">404</p>

            <h1 class="text-8 fw-bold mt-3 mb-3">This page doesn't exist</h1>

            <p class="text-5 text-muted mb-5">
              The address is wrong, or the page has moved. Here are two
              places to easily get back on track.
            </p>

            <div class="d-flex flex-wrap justify-content-center gap-3">
              <a href="index.en" class="btn btn-primary btn-lg fw-bold">
                Home
              </a>
              <a href="docs.en" class="btn btn-outline-dark btn-lg fw-bold">
                Documentation
              </a>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="js/molique-script.js?v={{ __version }}"></script>
  </body>
</html>
