<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>molique - Starter</title>

    <!--
      FAVICONY: celowo puste. Ten plik kopiujesz do własnego projektu, więc
      wstawienie tu ikon molique dałoby Twojej stronie CUDZE logo w karcie
      przeglądarki. Wygeneruj własny komplet i odkomentuj poniższe:
    -->
    <!--
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    -->

    <!--
      OPCJONALNIE: preload najważniejszych wag Poppins - skraca pierwsze
      renderowanie. Same @font-face są już wbudowane w molique-style.css;
      wymagany jest tylko folder fonts/ obok css/.
    -->
    <link rel="preload" href="fonts/poppins-v24-latin-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/poppins-v24-latin-ext-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/poppins-v24-latin-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/poppins-v24-latin-ext-600.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Rdzeń frameworka (wymagany) -->
    <link rel="stylesheet" href="css/molique-style.css?v={{ __version }}" />

    <!--
      OPCJONALNE moduły - dołącz tylko te, których używasz:
      <link rel="stylesheet" href="css/molique-style-admin.css?v={{ __version }}" />
      <link rel="stylesheet" href="css/molique-style-shop.css?v={{ __version }}" />
      <link rel="stylesheet" href="css/molique-style-blog.css?v={{ __version }}" />
    -->
  </head>
  <body>
    <main class="container py-5">
      <span class="badge badge-primary mb-3">molique</span>
      <h1 class="text-8 fw-black mb-3">Witaj w molique!</h1>
      <p class="text-4 text-muted mb-4">
        Ultralekki framework CSS B2B na natywnych warstwach kaskadowych.
        To jest szablon startowy - usuń zawartość i zacznij budować.
      </p>

      <div class="d-flex flex-wrap gap-2 mb-5">
        <button class="btn btn-primary">Przycisk główny</button>
        <button class="btn btn-outline-primary">Drugorzędny</button>
      </div>

      <div class="grid-cols-1 grid-md-cols-3 gap-3">
        <div class="card">
          <div class="card-header fw-bold">Karta</div>
          <div class="card-body">
            <p class="m-0 text-muted">
              Komponenty molique działają od razu, bez konfiguracji.
            </p>
          </div>
        </div>
        <div class="card">
          <div class="card-body">
            <div class="form-floating">
              <input type="text" class="input" id="starterInput" placeholder=" " />
              <label for="starterInput">Pole tekstowe</label>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="card-body d-flex flex-column gap-2">
            <div class="alert alert-success m-0">Gotowe do pracy.</div>
            <label class="form-switch">
              <input type="checkbox" class="form-switch-input" checked />
              <span class="form-switch-label">Przełącznik</span>
            </label>
          </div>
        </div>
      </div>
    </main>

    <!--
      Rdzeń JS + autoloader modułów. MUSI mieć atrybut defer.
      Autoloader dociąga moduły z js/modules/ tylko, gdy dany
      komponent istnieje na stronie - zostaw folder js/ w całości.
    -->
    <script defer src="js/molique-script.js?v={{ __version }}"></script>
  </body>
</html>
