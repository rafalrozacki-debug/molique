<meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Preload obrazu tla hero (LCP na stronach, ktore go maja) - ustawiane
         per-strona przez <include locals='{"heroImage":"..."}'>. Tlo jest
         w CSS (background: url(...)), wiec bez tego przegladarka odkrywa
         ten zasob dopiero po sparsowaniu CSSOM; preload + fetchpriority=high
         (fetchpriority nie dziala na tle CSS bezposrednio) daje mu
         pierwszenstwo od razu. -->
    <if condition="heroImage"><link rel="preload" as="image" href="{{ heroImage }}" fetchpriority="high" />
    </if>
    <!-- Zapobiega FOUC (flash of unstyled content): ustawia motyw i
         szerokosc sidebara PRZED pierwszym renderowaniem, zamiast czekac
         na DOMContentLoaded w molique-script.js (ktory i tak dalej
         obsluguje klikniecia/przelaczanie - ten skrypt tylko odczytuje juz
         zapisany stan). Musi byc synchroniczny (bez defer/async/module) i
         jak najwyzej w <head>, zanim przegladarka narysuje cokolwiek. -->
    <script>
      (function () {
        try {
          var html = document.documentElement;
          var savedTheme = localStorage.getItem('molique-theme');
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          html.setAttribute('data-theme', savedTheme || (systemDark ? 'dark' : 'light'));

          var savedSidebar = localStorage.getItem('molique-sidebar-state');
          if (savedSidebar === 'sidebar-md' || savedSidebar === 'sidebar-sm') {
            html.classList.add(savedSidebar);
          }
        } catch (e) {}
      })();
    </script>

    <title>{{ title }}</title>
    <if condition="description"><meta name="description" content="{{ description }}" />
    </if><meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#5145E5" />

    <!-- i18n: warianty jezykowe tej strony. __hasEn/__hasDe sa false, gdy
         plik-tlumaczenie jeszcze nie istnieje w src/ (patrz computeI18nLocals
         w vite.config.js) - wtedy <if> pomija dany hreflang, zamiast wskazywac
         wyszukiwarce na nieistniejacy adres. Bezwzgledne __hreflangXx (nie
         wzgledne __altXx uzywane w przelaczniku jezyka navbaru) - Google
         odrzuca wzgledne wartosci hreflang. -->
    <link rel="alternate" hreflang="pl" href="{{ __hreflangPl }}" />
    <if condition="__hasEn"><link rel="alternate" hreflang="en" href="{{ __hreflangEn }}" />
    </if><if condition="__hasDe"><link rel="alternate" hreflang="de" href="{{ __hreflangDe }}" />
    </if><link rel="alternate" hreflang="x-default" href="{{ __hreflangPl }}" />

    <!-- Favicony. Ścieżki WZGLĘDNE, tak jak reszta zasobów (vite base: './') —
         strona ma działać spod dowolnego katalogu hostingu, a build jest
         płaski, więc te same odwołania są poprawne z każdej podstrony. -->
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />

    <link rel="preload" href="fonts/poppins-v24-latin-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/poppins-v24-latin-ext-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/poppins-v24-latin-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/poppins-v24-latin-ext-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/molique-style.css?v={{ __version }}" />
