<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>molique - Starter</title>

    <!--
      FAVICONS: intentionally empty. You copy this file into your own
      project, so adding molique's icons here would give your site
      SOMEONE ELSE'S logo in the browser tab. Generate your own set and
      uncomment the following:
    -->
    <!--
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    -->

    <!--
      OPTIONAL: preload the main fonts (Inter + Poppins) - shortens
      first render. The @font-face rules themselves are already built
      into molique-style.css; you only need the fonts/ folder next to
      css/.
    -->
    <link rel="preload" href="fonts/inter-v20-latin_latin-ext-regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/poppins-v24-latin-600.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Framework core (required) -->
    <link rel="stylesheet" href="css/molique-style.css?v={{ __version }}" />

    <!--
      OPTIONAL modules - include only the ones you use:
      <link rel="stylesheet" href="css/molique-style-admin.css?v={{ __version }}" />
      <link rel="stylesheet" href="css/molique-style-shop.css?v={{ __version }}" />
      <link rel="stylesheet" href="css/molique-style-blog.css?v={{ __version }}" />
    -->
  </head>
  <body>
    <main class="container py-5">
      <span class="badge badge-primary mb-3">molique</span>
      <h1 class="text-8 fw-black mb-3">Welcome to molique!</h1>
      <p class="text-4 text-muted mb-4">
        An ultralight B2B CSS framework built on native cascade layers.
        This is a starter template - remove the content and start building.
      </p>

      <div class="d-flex flex-wrap gap-2 mb-5">
        <button class="btn btn-primary">Primary button</button>
        <button class="btn btn-outline-primary">Secondary</button>
      </div>

      <div class="grid-cols-1 grid-md-cols-3 gap-3">
        <div class="card">
          <div class="card-header fw-bold">Card</div>
          <div class="card-body">
            <p class="m-0 text-muted">
              molique components work out of the box, with zero configuration.
            </p>
          </div>
        </div>
        <div class="card">
          <div class="card-body">
            <div class="form-floating">
              <input type="text" class="input" id="starterInput" placeholder=" " />
              <label for="starterInput">Text field</label>
            </div>
          </div>
        </div>
        <div class="card">
          <div class="card-body d-flex flex-column gap-2">
            <div class="alert alert-success m-0">Ready to go.</div>
            <label class="form-switch">
              <input type="checkbox" class="form-switch-input" checked />
              <span class="form-switch-label">Switch</span>
            </label>
          </div>
        </div>
      </div>
    </main>

    <!--
      JS core + module autoloader. MUST have the defer attribute.
      The autoloader only pulls in modules from js/modules/ when the
      matching component exists on the page - leave the js/ folder
      intact.
    -->
    <script defer src="js/molique-script.js"></script>
  </body>
</html>
