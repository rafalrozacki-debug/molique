  <div class="mb-4">
    <label class="fw-bold mb-2 d-block">{{ LABEL }}</label>
    <div class="custom-select shadow-sm">
      <button type="button" class="custom-select-trigger" popovertarget="custom-select-field">
        <span class="custom-select-pills">
          <span class="text-muted">{{ PLACEHOLDER }}</span>
        </span>
        <span class="d-flex align-items-center gap-2 text-muted">
          <svg class="icon-chevron" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 256 256">
            <path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"></path>
          </svg>
        </span>
      </button>

      <div class="custom-select-dropdown" popover id="custom-select-field">
        <div class="custom-select-search">
          <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 256 256">
            <path d="M229.66,218.34l-50.07-50.06a88.11,88.11,0,1,0-11.31,11.31l50.06,50.07a8,8,0,0,0,11.32-11.32ZM40,112a72,72,0,1,1,72,72A72.08,72.08,0,0,1,40,112Z"></path>
          </svg>
          <input type="text" class="input" placeholder="Szukaj..." />
        </div>

        <div class="custom-select-list">
{{ CATEGORIES }}
        </div>

        <div class="p-2 border-top d-flex gap-2">
          <button type="button" class="btn bg-body text-muted border flex-1">Wyczyść</button>
          <button type="button" class="btn btn-primary flex-1">Zastosuj</button>
        </div>
      </div>
    </div>
  </div>
