<!-- Requires: css/molique-style-before-after.css -->
<div class="before-after-slider mx-auto" style="max-width: {{ MAX_WIDTH }}; width: 100%; aspect-ratio: {{ ASPECT_RATIO }}">
  <img src="{{ AFTER_IMG }}" alt="{{ AFTER_ALT }}" class="before-after-img img-after" />
  <img src="{{ BEFORE_IMG }}" alt="{{ BEFORE_ALT }}" class="before-after-img img-before" />
  <input type="range" class="slider-control" min="0" max="100" value="50" aria-label="Drag to compare photos" />
  <div class="slider-line"></div>
  <div class="slider-handle"></div>
</div>
