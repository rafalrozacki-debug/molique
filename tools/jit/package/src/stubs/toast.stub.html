<button id="{{ TRIGGER_ID }}" class="btn-{{ TYPE }}">{{ TRIGGER_LABEL }}</button>
<script>
  document.getElementById('{{ TRIGGER_ID }}').addEventListener('click', () => {
    MoliqueToast.show({
      message: '{{ MESSAGE }}',
      type: '{{ TYPE }}',
      position: '{{ POSITION }}',
      duration: {{ DURATION }}
    });
  });
</script>
