<dialog id="{{ ID }}" class="modal-dialog">
  <div class="card border-0">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h2 class="h5 m-0">{{ TITLE }}</h2>
      <form method="dialog">
        <button class="modal-close-btn" aria-label="Zamknij">&times;</button>
      </form>
    </div>
    <div class="card-body">
      <p>{{ BODY }}</p>
    </div>
  </div>
</dialog>
