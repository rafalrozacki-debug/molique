  <div class="mb-4">
    <label class="fw-bold mb-2 d-block">{{ LABEL }}</label>
    <div class="select-search">
      <button type="button" class="input select-search-trigger" popovertarget="select-search-field">
        <span style="color: var(--text-muted)">{{ PLACEHOLDER }}</span>
      </button>

      <div class="select-search-menu shadow-lg" popover id="select-search-field">
        <input type="text" class="input select-search-input" placeholder="Search..." />

        <div class="select-search-list">
{{ OPTIONS }}
        </div>
      </div>

      <input type="hidden" name="{{ FIELD_NAME }}" class="select-search-hidden" />
    </div>
  </div>
