<dialog id="{{ ID }}" class="modal-dialog modal-context">
  <div class="card border-0">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h2 class="fw-bold">{{ TITLE }}</h2>
      <form method="dialog">
        <button class="modal-close-btn" aria-label="Zamknij">&times;</button>
      </form>
    </div>
    <div class="card-body">
      <ul class="modal-action-list">
        <li>
          <button class="modal-action-btn">
            <svg class="icon" aria-hidden="true"><use href="img/icons-sprite.svg#{{ ACTION_1_ICON }}"></use></svg>
            {{ ACTION_1_LABEL }}
          </button>
        </li>
        <li>
          <button class="modal-action-btn {{ ACTION_2_CLASS }}">
            <svg class="icon" aria-hidden="true"><use href="img/icons-sprite.svg#{{ ACTION_2_ICON }}"></use></svg>
            {{ ACTION_2_LABEL }}
          </button>
        </li>
      </ul>
    </div>
  </div>
</dialog>
