<dialog id="{{ ID }}" class="modal-dialog modal-confirm">
  <div class="card border-0">
    <div class="card-body">
      <div class="modal-confirm-icon">
        <svg class="icon" aria-hidden="true"><use href="img/icons-sprite.svg#{{ ICON }}"></use></svg>
      </div>
      <h2 class="fw-bold mb-2">{{ TITLE }}</h2>
      <p class="text-muted m-0">{{ MESSAGE }}</p>
    </div>
    <div class="card-footer">
      <form method="dialog">
        <button class="btn-secondary">{{ CANCEL_LABEL }}</button>
      </form>
      <form method="dialog">
        <button class="{{ CONFIRM_VARIANT }}">{{ CONFIRM_LABEL }}</button>
      </form>
    </div>
  </div>
</dialog>
