<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480">
  <!-- Wersja uproszczona (wyśrodkowane przekątne) - przy ~20px
       nieodróżnialna od heraldycznej -->
  <rect width="640" height="480" fill="#012169"/>
  <path d="M0,0 640,480 M640,0 0,480" stroke="#fff" stroke-width="96"/>
  <path d="M0,0 640,480 M640,0 0,480" stroke="#c8102e" stroke-width="48"/>
  <path d="M320,0 V480 M0,240 H640" stroke="#fff" stroke-width="160"/>
  <path d="M320,0 V480 M0,240 H640" stroke="#c8102e" stroke-width="96"/>
</svg>
